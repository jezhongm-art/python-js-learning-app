<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript コーディング問題 - Python 学習プラットフォーム拡張</title>
    <!-- Tailwind CSS & Typography -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        darkMode: 'class'
      }
    </script>
    <!-- Blocking Theme Initializer (Avoids FOUC/Light Flash) -->
    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <!-- Marked.js -->
    <script
      src="https://cdn.jsdelivr.net/npm/marked@14.1.0/marked.min.js"
      integrity="sha384-kBc7AQeO5AZTsOrf8p0QKrwpCLgLg4cMCFnCiGDubrCOzmUZEIQjN178ofwtRPOG"
      crossorigin="anonymous"
    ></script>
    <!-- DOMPurify -->
    <script
      src="https://cdn.jsdelivr.net/npm/dompurify@3.4.11/dist/purify.min.js"
      integrity="sha384-o44XUELLEnv/iSlA1NWxBweqbD4TSR0qgq2VzVsxtkHS989JJjGKSE9vkfo5MN4K"
      crossorigin="anonymous"
    ></script>
    <!-- Style Sheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- ==================== ヘッダー ==================== -->
    <header class="bg-indigo-600 dark:bg-slate-900 text-white shadow-md transition-colors duration-200">
      <div
        class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4"
      >
        <div class="flex items-center gap-3">
          <span class="bg-emerald-500 text-slate-950 font-bold px-2.5 py-1 rounded text-xs tracking-wider uppercase">Extension</span>
          <h1 class="text-xl font-bold tracking-tight whitespace-nowrap">
            JavaScript コーディングチャレンジ
          </h1>
        </div>

        <div class="flex items-center gap-2">
          <!-- APIキー設定トグル -->
          <button
            id="api-key-toggle-btn"
            title="Gemini APIキー設定"
            class="bg-indigo-700 hover:bg-indigo-800 dark:bg-slate-800 dark:hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 border border-indigo-500/30 dark:border-slate-700"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            APIキー
          </button>

          <!-- テーマ切り替えトグル -->
          <button
            id="theme-toggle-btn"
            class="bg-indigo-700 hover:bg-indigo-800 dark:bg-slate-800 dark:hover:bg-slate-700 text-indigo-100 hover:text-white dark:text-slate-300 dark:hover:text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 border border-indigo-500/30 dark:border-slate-700"
            title="テーマ切り替え"
          >
            <svg id="theme-toggle-dark-icon" class="h-3.5 w-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
            <svg id="theme-toggle-light-icon" class="h-3.5 w-3.5 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.46 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
            <span id="theme-toggle-text">ダークモード</span>
          </button>

          <!-- Pythonプラットフォームへのリンク -->
          <a
            href="../index.html"
            class="bg-indigo-700 hover:bg-indigo-800 dark:bg-slate-800 dark:hover:bg-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 border border-indigo-500/30 dark:border-slate-700 whitespace-nowrap"
          >
            ← Python学習に戻る
          </a>
        </div>
      </div>
    </header>

    <!-- ==================== APIキー設定パネル ==================== -->
    <div id="api-key-panel" class="hidden bg-slate-100 dark:bg-slate-900/60 border-b border-slate-200 dark:border-slate-800 shadow-inner transition-colors duration-200">
      <div class="max-w-6xl mx-auto px-4 py-4">
        <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3">
          <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 whitespace-nowrap">Gemini API キー</label>
          <input
            id="api-key-input"
            type="text"
            autocomplete="new-password"
            name="gemini_api_key_field"
            placeholder="AIza..."
            class="flex-1 px-3 py-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-800 dark:text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono api-key-mask"
          />
          <div class="flex items-center gap-2">
            <button
              id="api-key-save-btn"
              class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors"
            >
              保存
            </button>
            <button
              id="api-key-clear-btn"
              class="bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 px-4 py-2 rounded-lg text-sm font-semibold transition-colors"
            >
              削除
            </button>
          </div>
          <div id="api-key-status" class="text-xs hidden"></div>
        </div>
      </div>
    </div>

    <!-- ==================== AIローディング画面 ==================== -->
    <div id="ai-loading-screen" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50">
      <div class="bg-white dark:bg-slate-900 border border-slate-100 dark:border-slate-800 rounded-2xl p-8 shadow-2xl max-w-sm w-full mx-4 text-center transition-colors duration-200">
        <div class="flex justify-center mb-4">
          <div class="relative w-16 h-16">
            <div class="absolute inset-0 rounded-full border-4 border-slate-100 dark:border-slate-800"></div>
            <div class="absolute inset-0 rounded-full border-4 border-t-indigo-600 animate-spin"></div>
          </div>
        </div>
        <h3 id="ai-loading-title" class="text-lg font-bold text-slate-800 dark:text-slate-100 mb-2">AIが処理中...</h3>
        <p id="ai-loading-desc" class="text-sm text-slate-500 dark:text-slate-400">しばらくお待ちください。</p>
      </div>
    </div>

    <!-- ==================== メインコンテンツ ==================== -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">

      <!-- ====== 左コラム: 問題選択 & 問題説明 & AI生成 ====== -->
      <section class="lg:col-span-5 flex flex-col gap-6">

        <!-- 問題選択リスト -->
        <div class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-5 transition-colors duration-200">
          <h2 class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-3">課題リスト</h2>
          <div id="challenge-list" class="flex flex-col gap-2">
            <!-- JS動的生成 -->
          </div>
        </div>

        <!-- AI問題生成パネル -->
        <div class="bg-gradient-to-r from-indigo-50 to-purple-50 dark:from-slate-900 dark:to-slate-850 rounded-xl shadow-sm border border-indigo-100 dark:border-slate-800 p-5 transition-colors duration-200">
          <div class="flex items-center gap-2 mb-4">
            <span class="text-xl">✨</span>
            <h2 class="text-sm font-bold text-indigo-900 dark:text-indigo-300 uppercase tracking-wider">AI問題ジェネレーター</h2>
          </div>
          <p class="text-xs text-indigo-600 dark:text-indigo-400 mb-4 leading-relaxed">
            AIが新しいJavaScript課題を自動生成します。テーマや難易度を指定してください。
          </p>

          <div class="flex flex-col gap-3">
            <div class="flex gap-2">
              <select
                id="ai-difficulty-select"
                class="flex-1 px-3 py-2 rounded-lg bg-white dark:bg-slate-800 border border-indigo-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
              >
                <option value="easy">🟢 簡単</option>
                <option value="medium" selected>🟡 普通</option>
                <option value="hard">🔴 難しい</option>
              </select>
            </div>
            <input
              id="ai-topic-input"
              type="text"
              placeholder="例: 再帰、配列操作、文字列（空白でランダム）"
              class="px-3 py-2 rounded-lg bg-white dark:bg-slate-800 border border-indigo-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
            <button
              id="ai-generate-btn"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-4 rounded-lg transition-all flex items-center justify-center gap-2 text-sm shadow-sm"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd" />
              </svg>
              AI問題を生成する
            </button>
          </div>
        </div>

        <!-- 問題説明パネル -->
        <div class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-6 flex-1 flex flex-col transition-colors duration-200">
          <div class="border-b border-slate-100 dark:border-slate-800 pb-4 mb-4">
            <h2 id="challenge-title" class="text-2xl font-bold text-slate-900 dark:text-slate-100">
              課題を選択してください
            </h2>
            <div id="challenge-difficulty" class="mt-2"></div>
          </div>
          <div
            id="challenge-description"
            class="prose prose-slate dark:prose-invert max-w-none text-slate-600 dark:text-slate-400 flex-1 leading-relaxed"
          >
            <p class="text-slate-400 dark:text-slate-500">課題を選択すると、ここに詳しい問題説明が表示されます。</p>
          </div>
        </div>
      </section>

      <!-- ====== 右コラム: エディタ & テスト実行 & AIコーチ ====== -->
      <section class="lg:col-span-7 flex flex-col gap-6">

        <!-- エディタパネル -->
        <div class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-5 flex flex-col transition-colors duration-200">
          <div class="flex justify-between items-center mb-4">
            <span class="text-sm font-semibold text-slate-600 dark:text-slate-400">解答コード (JavaScript)</span>
            <div class="flex gap-2">
              <button
                id="format-btn"
                class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-lg text-xs font-semibold transition-colors"
              >
                コード整形
              </button>
              <button
                id="reset-btn"
                class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-lg text-xs font-semibold transition-colors"
              >
                初期化
              </button>
            </div>
          </div>

          <!-- エディタ本体 -->
          <div class="editor-wrapper h-80 min-h-[200px] max-h-[600px] resize-y mb-4">
            <div id="line-numbers-container" class="line-numbers-container">
              <div class="editor-line">1</div>
            </div>
            <div class="editor-area-container">
              <div id="editor-backdrop" class="editor-backdrop"></div>
              <textarea
                id="code-editor"
                class="code-editor-textarea"
                spellcheck="false"
                placeholder="// ここにJavaScriptコードを記述してください"
              ></textarea>
            </div>
          </div>

          <!-- テスト実行 & AIコーチ ボタン行 -->
          <div class="flex gap-3">
            <button
              id="run-btn"
              class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-emerald-600/10 transition-all flex items-center justify-center gap-2 hover:-translate-y-0.5 active:translate-y-0"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
              </svg>
              テスト実行
            </button>
            <button
              id="ai-coach-btn"
              class="flex-1 bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-950/30 dark:hover:bg-indigo-950/50 text-indigo-700 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-900/50 font-bold py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
              </svg>
              ✨ AIコーチに相談
            </button>
          </div>
        </div>

        <!-- テスト結果パネル -->
        <div id="result-container" class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 p-5 hidden transition-colors duration-200">
          <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-3 mb-4">
            <h3 class="font-bold text-slate-800 dark:text-slate-200">テスト結果</h3>
            <span id="result-badge" class="text-xs font-bold px-3 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200">
              未実行
            </span>
          </div>
          <div id="test-cases-results" class="flex flex-col gap-3"></div>
        </div>

        <!-- AIコーチ パネル -->
        <div id="ai-coach-panel" class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-indigo-200 dark:border-indigo-900/30 p-5 hidden transition-colors duration-200">
          <div class="flex justify-between items-center border-b border-indigo-100 dark:border-indigo-900/30 pb-3 mb-4">
            <div class="flex items-center gap-2">
              <span class="text-indigo-600 dark:text-indigo-400 text-lg">✨</span>
              <h3 class="font-bold text-slate-800 dark:text-slate-200">AIコーチからのアドバイス</h3>
            </div>
            <button id="ai-coach-close-btn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
              </svg>
            </button>
          </div>
          <div id="ai-coach-content" class="prose prose-indigo dark:prose-invert max-w-none text-sm leading-relaxed"></div>
        </div>

      </section>
    </main>

    <!-- ==================== フッター ==================== -->
    <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 text-center text-sm text-slate-500 dark:text-slate-400 mt-12 transition-colors duration-200">
      <div class="max-w-6xl mx-auto px-4">
        <p>&copy; 2026 JavaScript コーディングチャレンジ. All rights reserved.</p>
      </div>
    </footer>

    <!-- JS Logic -->
    <script type="module" src="app.js"></script>
  </body>
</html>
